name: tmp-update-01918-changelog

on:
  push:
    branches:
      - dev/0.19.18-warpscout-luci
    paths:
      - .github/workflows/_tmp_update_01918_changelog.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-warpscout-luci
          fetch-depth: 0

      - name: Update historical changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('CHANGELOG.md')
          text = p.read_text()
          marker = '## luci-app-podkop-bot\n\n'
          if '### 0.19.18 — WARPSCOUT, async diagnostics and r17 bot-state fix' not in text:
              section = '''### 0.19.18 — WARPSCOUT, async diagnostics and r17 bot-state fix

- **[Функция/WARP]** Добавлена интеграция WARPSCOUT и WARP Rescue: поиск и ранжирование WARP-узлов, учётная запись WARP, Telegram Bot API qualification, магазин `VALID`-кандидатов и отдельный «Револьвер WARP» с `FIRE`, `Next` и `Reload`. Пользовательский постоянный SOCKS — только Rescue; тестовый SOCKS остаётся внутренним.
- **[Интерфейс]** `Runtime` переименован в «Проверка маршрутов», `Пул прокси` — в «Цепочка прокси». Telegram qualification встроена в проверку маршрутов; старые URL сохранены совместимыми алиасами. Проведена редактура русских текстов и добавлены подсказки WARPSCOUT.
- **[Диагностика/P0]** Долгие проверки маршрутов и сервисов больше не держат один XHR 15–60+ секунд. Общая схема: `start → background worker → status polling → result`; применяется к Podkop/Forkop секциям, транспортным и ручным прокси, WARP, массовой проверке и полному Outbound-тесту. Потеря вкладки/XHR не убивает worker на роутере.
- **[WARP/P0]** Длинный WARP-probe выполняет server-side cleanup/restore тестового runtime при завершении, поэтому возврат Rescue больше не зависит только от frontend `finally`. На железе всё ещё требуется проверить восстановление точного прежнего endpoint при обрыве браузера/сети.
- **[Обновление]** Длинный preflight/скачивание установщика Podkop/Forkop также вынесены из одного XHR в detached launcher с коротким polling журнала.
- **[Баг/r17]** Исправлена регрессия state machine Telegram-бота: при незавершённом текстовом вводе (например `wait_admin_id`) кнопка `📊 Статус` ошибочно трактовалась как ввод ID и давала «Некорректный ID». Теперь `cmd_status` имеет приоритет, очищает pending state и открывает нормальный Status. Сначала исправлено в standalone `podkop_bot` (`f6236929`), затем синхронизировано во вендорную копию LuCI.
- **[Синхронизация]** `vendor.sha256` после r17: `0926d9797dcb951e286080c2ede09548cf2781b860e1df8a570e578f41182a8b`.
- **[Сборка/CI]** Текущий тестовый пакет — **0.19.18-r17**. GitHub Actions `#196` (`34822264197`) прошёл source checks, native build и установочные проверки OpenWrt 25.12 APKv3 и 24.10 IPK. Artifact `owfeed-packages`, id `10338378001`, digest `sha256:910eed092bf8f0c0af16728c5571eedca2e11df17154df0b6d083bee9826ec55`.
- **[Долг]** Не заявлять готовыми: постоянный WARP process-death watchdog/авторотацию, автоматический POLL/FAST failover через WARP, persistent TG-статус shortlist, полные metadata Overview по реальному Rescue endpoint, богатую итоговую batch-сводку и активную Bearhole routing semantics.

'''
              if marker not in text:
                  raise SystemExit('luci changelog marker not found')
              text = text.replace(marker, marker + section, 1)
              p.write_text(text)
          PY

      - name: Commit changelog and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_update_01918_changelog.yml
          git add CHANGELOG.md
          git commit -m "docs: add 0.19.18 development summary to changelog"
          git push origin HEAD:dev/0.19.18-warpscout-luci
