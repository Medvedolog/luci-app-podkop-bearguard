name: Apply Bearhole rescue hardening

on:
  push:
    branches:
      - dev/0.19.18-bearhole-mvp

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-bearhole-mvp
          fetch-depth: 0
      - name: Repair one-line patch anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply-bearhole-hardening.py')
          s=p.read_text()
          old='    r"bh_results_json\\(\\)\\{.*?\\n\\}",\n'
          new='    r"bh_results_json\\(\\)\\{.*?\\n\\nbh_disable",\n'
          if old not in s:
              raise SystemExit('results pattern anchor not found')
          s=s.replace(old,new,1)
          old2="    flags=re.S,\n)\n\nrep_once(\n    bh,\n    '''case \"${1:-}\" in"
          new2="    flags=re.S,\n)\n\n# delimiter is consumed by the regex above, so restore it before the next patch\np=Path(bh); t=p.read_text(); t=t.replace('\\n\\nbh_disable','\\n\\nbh_disable',1); p.write_text(t)\n\nrep_once(\n    bh,\n    '''case \"${1:-}\" in"
          # The replacement text itself must also include the consumed delimiter.
          needle="    '''bh_results_json(){ printf '{\\\"ok\\\":true,\\\"items\\\":[';"
          if needle not in s:
              raise SystemExit('results replacement anchor not found')
          # Append bh_disable to the triple-quoted replacement before flags=re.S.
          marker="; printf ']}\\\\n'; }''',\n    flags=re.S,"
          if marker not in s:
              raise SystemExit('results replacement tail not found')
          s=s.replace(marker,"; printf ']}\\\\n'; }\\n\\nbh_disable''',\n    flags=re.S,",1)
          p.write_text(s)
          PY
      - name: Apply hardening patch
        run: python3 tools/apply-bearhole-hardening.py
      - name: Validate shell and invariants
        shell: bash
        run: |
          set -euo pipefail
          sh -n root/usr/lib/podkop_bot/bearhole.sh
          sh -n root/usr/libexec/rpcd/podkop_bot_bearhole
          sh -n root/etc/init.d/podkop-bearhole
          grep -Fq 'procd_set_param respawn 3600 5 0' root/etc/init.d/podkop-bearhole
          grep -Fq 'bh_activate' root/usr/lib/podkop_bot/bearhole.sh
          grep -Fq 'bh_guard' root/usr/lib/podkop_bot/bearhole.sh
          grep -Fq 'package-manager-call' root/usr/lib/podkop_bot/bearhole.sh
          grep -Fq 'UNSUPPORTED' root/usr/lib/podkop_bot/bearhole.sh
          grep -Fq 'cold_trigger' root/usr/lib/podkop_bot/bearhole.sh
          grep -Fq 'github_asset_host' root/www/luci-static/resources/view/podkop-bot/bearhole.js
          grep -Fq 'ʕ•ᴥ•ʔ' hwelp-proxy/src/hwelp-proxy.c
          grep -Fq 'PKG_RELEASE:=33' Makefile
          grep -Fq 'PKG_VERSION:=0.1.2' hwelp-proxy/Makefile
      - name: Commit hardened source and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-bearhole-rescue-hardening.yml tools/apply-bearhole-hardening.py
          git config user.name 'medvedolog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(bearhole): harden reboot crash package-manager and WARP rescue paths'
          git push origin HEAD:dev/0.19.18-bearhole-mvp
