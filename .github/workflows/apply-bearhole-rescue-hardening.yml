name: Apply Bearhole rescue hardening

on:
  push:
    branches:
      - dev/0.19.18-bearhole-mvp

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-bearhole-mvp
          fetch-depth: 0
      - name: Apply hardening patch
        run: python3 tools/apply-bearhole-hardening.py
      - name: Validate shell and invariants
        shell: bash
        run: |
          set -euo pipefail
          sh -n root/usr/lib/podkop_bot/bearhole.sh
          sh -n root/usr/libexec/rpcd/podkop_bot_bearhole
          sh -n root/etc/init.d/podkop-bearhole
          grep -Fq 'procd_set_param respawn 3600 5 0' root/etc/init.d/podkop-bearhole
          grep -Fq 'bh_activate' root/usr/lib/podkop_bot/bearhole.sh
          grep -Fq 'bh_guard' root/usr/lib/podkop_bot/bearhole.sh
          grep -Fq 'package-manager-call' root/usr/lib/podkop_bot/bearhole.sh
          grep -Fq 'UNSUPPORTED' root/usr/lib/podkop_bot/bearhole.sh
          grep -Fq 'cold_trigger' root/usr/lib/podkop_bot/bearhole.sh
          grep -Fq 'github_asset_host' root/www/luci-static/resources/view/podkop-bot/bearhole.js
          grep -Fq 'ʕ•ᴥ•ʔ' hwelp-proxy/src/hwelp-proxy.c
          grep -Fq 'PKG_RELEASE:=33' Makefile
          grep -Fq 'PKG_VERSION:=0.1.2' hwelp-proxy/Makefile
      - name: Commit hardened source and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-bearhole-rescue-hardening.yml tools/apply-bearhole-hardening.py
          git config user.name 'medvedolog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(bearhole): harden reboot crash package-manager and WARP rescue paths'
          git push origin HEAD:dev/0.19.18-bearhole-mvp
