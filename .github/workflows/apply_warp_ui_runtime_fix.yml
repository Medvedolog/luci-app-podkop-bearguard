name: Apply WARP UI/runtime regression fix

on:
  push:
    branches:
      - dev/0.19.18-bearhole-mvp
    paths:
      - .github/tmp_fix_warp_ui_runtime.py
      - .github/workflows/apply_warp_ui_runtime_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-bearhole-mvp
          fetch-depth: 0
      - name: Apply prepared patch
        run: python3 .github/tmp_fix_warp_ui_runtime.py
      - name: Validate patched sources
        run: |
          node --check root/www/luci-static/resources/view/podkop-bot/warpscout.js
          node --check root/www/luci-static/resources/view/podkop-bot/warpscout-rescue.js
          sh -n root/usr/libexec/rpcd/podkop_bot_warpscout_rescue
          sh -n root/usr/libexec/rpcd/podkop_bot
          sh tools/check-sources.sh
      - name: Commit patched tree and remove applicator
        run: |
          rm -f .github/tmp_fix_warp_ui_runtime.py .github/workflows/apply_warp_ui_runtime_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(warp): repair revolver reload and manual TG UI"
          git push origin HEAD:dev/0.19.18-bearhole-mvp
