name: bearhole-finalize-once

on:
  push:
    branches:
      - dev/0.19.18-bearhole-mvp

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply final Bearhole patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.bearhole-final.patch.* > /tmp/bearhole-final.patch

          if git apply --reverse --check /tmp/bearhole-final.patch >/dev/null 2>&1; then
            echo "Bearhole final patch is already applied"
            exit 0
          fi

          git apply --check /tmp/bearhole-final.patch
          git apply /tmp/bearhole-final.patch

          sh -n root/usr/libexec/rpcd/podkop_bot
          sh -n root/etc/init.d/podkop-bearhole
          node --check root/www/luci-static/resources/view/podkop-bot/transport.js
          jq empty root/usr/share/luci/menu.d/luci-app-podkop-bot.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            root/usr/libexec/rpcd/podkop_bot \
            root/etc/init.d/podkop-bearhole \
            root/usr/bin/podkop-bearhole-proxy \
            root/www/luci-static/resources/view/podkop-bot/transport.js \
            root/usr/share/luci/menu.d/luci-app-podkop-bot.json

          if git diff --cached --quiet; then
            echo "No target changes to commit"
            exit 0
          fi

          git commit -m "feat: finish Bearhole system routing integration"
          git push origin HEAD:dev/0.19.18-bearhole-mvp
