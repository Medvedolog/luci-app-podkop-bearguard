name: build-r61-tsnet-status
on:
  push:
    branches: [dev/0.19.18-tailscale-multiprovider]
    paths: ['.github/workflows/build-r61-tsnet-status.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev/0.19.18-tailscale-multiprovider
      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1
      - name: Apply r61 patch
        run: python3 .github/r61_patch.py
      - name: Validate
        run: |
          set -eu
          sh -n root/usr/libexec/rpcd/podkop_bot_tailscale
          sh -n root/usr/lib/podkop_bot/tsnet-provider.sh
          sh -n root/usr/lib/podkop_bot/tsnet-overlay-watch.sh
          grep -q '^PKG_RELEASE:=61$' Makefile
          grep -Fq 'set_accept_routes' root/usr/libexec/rpcd/podkop_bot_tailscale
          grep -Fq 'runtime_state' root/usr/libexec/rpcd/podkop_bot_tailscale
          grep -Fq 'accept_routes' root/usr/lib/podkop_bot/tsnet-overlay-watch.sh
          sh tools/check-sources.sh
      - name: Commit
        run: |
          git config user.name medvedolog
          git config user.email tenkayyy8@gmail.com
          git add Makefile root/usr/libexec/rpcd/podkop_bot_tailscale root/usr/lib/podkop_bot/tsnet-provider.sh root/usr/lib/podkop_bot/tsnet-overlay-watch.sh
          git commit -m 'feat: add tsnet runtime status and route controls'
          git push origin HEAD:dev/0.19.18-tailscale-multiprovider
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./tools/stage.sh
          owfeed plan
          owfeed build
          sh tools/check-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: luci-app-podkop-bot-0.19.18-r61
          path: dist/
          if-no-files-found: error
