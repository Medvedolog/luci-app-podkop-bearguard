name: dev-r57-package

on:
  push:
    branches: [dev/0.19.18-tailscale-multiprovider]
    paths:
      - '.github/workflows/dev-r57-package.yml'
      - 'root/usr/lib/podkop_bot/vendor.sha256'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1
      - name: Reproducible package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Source checks
        run: sh tools/check-sources.sh
      - name: Async wrapper checks
        continue-on-error: true
        run: sh tools/check-async-wrappers.sh
      - name: Stage
        run: ./tools/stage.sh
      - name: Plan
        run: owfeed plan
      - name: Owfeed check
        run: owfeed check
      - name: Build
        run: owfeed build
      - name: Package check
        run: sh tools/check-package.sh
      - name: Verify artifacts
        run: |
          set -eu
          find dist -maxdepth 2 -type f -print | sort
          test -n "$(find dist/all -maxdepth 1 -type f -name 'luci-app-podkop-bot_*.ipk' -print -quit)"
          test -n "$(find dist/noarch -maxdepth 1 -type f -name 'luci-app-podkop-bot-*.apk' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: luci-app-podkop-bot-0.19.18-r57
          path: dist/
          if-no-files-found: error
