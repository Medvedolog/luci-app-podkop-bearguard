name: Fix Bearhole rpcd JSON input

on:
  push:
    branches:
      - dev/0.19.18-bearhole-mvp

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-bearhole-mvp
          fetch-depth: 0
      - name: Patch rpcd stdin handling and bump r35
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('root/usr/libexec/rpcd/podkop_bot_bearhole')
          s = p.read_text()

          old = "                read -r _in 2>/dev/null || _in='{}'\n"
          new = "                # rpcd may provide compact JSON without a trailing newline; `read` then\n                # returns non-zero despite assigning data. Consume stdin fully instead.\n                _in=$(cat 2>/dev/null); [ -n \"$_in\" ] || _in='{}'\n"
          n = s.count(old)
          if n < 4:
              raise SystemExit(f'expected >=4 parameterized rpcd reads, got {n}')
          s = s.replace(old, new)

          old_ignore = "                read -r _in 2>/dev/null || true\n"
          n_ignore = s.count(old_ignore)
          if n_ignore < 4:
              raise SystemExit(f'expected >=4 ignored rpcd reads, got {n_ignore}')
          s = s.replace(old_ignore, "                cat >/dev/null 2>&1 || true\n")
          p.write_text(s)

          m = Path('Makefile')
          ms = m.read_text()
          if 'PKG_RELEASE:=34' not in ms:
              if 'PKG_RELEASE:=35' in ms:
                  pass
              else:
                  raise SystemExit('unexpected LuCI package release')
          else:
              ms = ms.replace('PKG_RELEASE:=34', 'PKG_RELEASE:=35', 1)
              m.write_text(ms)
          PY

          sh -n root/usr/libexec/rpcd/podkop_bot_bearhole
          grep -Fq '_in=$(cat 2>/dev/null)' root/usr/libexec/rpcd/podkop_bot_bearhole
          grep -Fq 'PKG_RELEASE:=35' Makefile
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'already applied'
            exit 0
          fi
          git config user.name 'medvedolog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add root/usr/libexec/rpcd/podkop_bot_bearhole Makefile
          git commit -m '0.19.18-r35: fix rpcd JSON input without trailing newline'
          git push origin HEAD:dev/0.19.18-bearhole-mvp
