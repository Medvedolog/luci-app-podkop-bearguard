name: Fix Runtime active server metadata

on:
  push:
    branches:
      - dev/0.19.18-bearhole-mvp

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-bearhole-mvp
          fetch-depth: 0

      - name: Sync bot and harden local Clash API discovery
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/Medvedolog/podkop_bot/dev/0.19.18-poll-warp-rescue/podkop_bot.sh' -o root/usr/lib/podkop_bot/podkop_bot
          chmod +x root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum podkop_bot > vendor.sha256)

          python3 - <<'PY'
          from pathlib import Path

          p = Path('root/usr/libexec/rpcd/podkop_bot')
          s = p.read_text()

          old_prefix = 'curl -s --connect-timeout 3 --max-time 8 ${_clash_hdr:+-H "$_clash_hdr"}'
          new_prefix = "curl -q -s --noproxy '*' --connect-timeout 3 --max-time 8 ${_clash_hdr:+-H \"$_clash_hdr\"}"
          count = s.count(old_prefix)
          if count:
              if count != 2:
                  raise SystemExit(f'unexpected local Clash curl count: {count}')
              s = s.replace(old_prefix, new_prefix)
          elif new_prefix not in s:
              raise SystemExit('local Clash curl anchor missing')

          probe_line = "\t_proxies=$(curl -q -s --noproxy '*' --connect-timeout 3 --max-time 8 ${_clash_hdr:+-H \"$_clash_hdr\"} \"http://${_clash_addr}/proxies\" 2>/dev/null)\n"
          retry_block = (
              probe_line
              + "\t# Bearhole installs a global curl config for system recovery. Clash API is a local\n"
              + "\t# control-plane endpoint and must never traverse hwelp. Retry once because sing-box\n"
              + "\t# may still be settling immediately after a reload.\n"
              + "\tif [ -z \"$_proxies\" ] || [ \"$_proxies\" = \"null\" ] || ! printf '%s' \"$_proxies\" | jq -e '.proxies | type == \"object\"' >/dev/null 2>&1; then\n"
              + "\t\tsleep 1\n"
              + "\t\t_proxies=$(curl -q -s --noproxy '*' --connect-timeout 3 --max-time 8 ${_clash_hdr:+-H \"$_clash_hdr\"} \"http://${_clash_addr}/proxies\" 2>/dev/null)\n"
              + "\tfi\n"
          )
          if 'control-plane endpoint and must never traverse hwelp' not in s:
              if probe_line not in s:
                  raise SystemExit('active_probe Clash /proxies call not found')
              s = s.replace(probe_line, retry_block, 1)

          exact_old = 'if ($p[$s] and (($p[$s].type == "Selector") or ($p[$s].type == "URLTest"))) then $s'
          exact_new = 'if ($p[$s] and (($p[$s].type == "Selector") or ($p[$s].type == "URLTest") or ($p[$s].type == "Fallback") or ($p[$s].type == "LoadBalance"))) then $s'
          if exact_old in s:
              s = s.replace(exact_old, exact_new, 1)

          map_old = '| map(select((.key | startswith($s)) and ((.value.type == "Selector") or (.value.type == "URLTest"))))'
          map_new = '| map(select((.key | startswith($s)) and ((.value.type == "Selector") or (.value.type == "URLTest") or (.value.type == "Fallback") or (.value.type == "LoadBalance"))))'
          if map_old in s:
              s = s.replace(map_old, map_new, 1)

          active = s.find('method_active_probe() {')
          tail = s.find('\ncase "$1" in', active)
          if active < 0 or tail < 0:
              raise SystemExit('active_probe bounds not found')
          body = s[active:tail]
          if 'Selector|URLTest|Fallback|LoadBalance)' not in body:
              if 'Selector|URLTest)' not in body:
                  raise SystemExit('active_probe selector case not found')
              body = body.replace('Selector|URLTest)', 'Selector|URLTest|Fallback|LoadBalance)', 1)
              s = s[:active] + body + s[tail:]

          p.write_text(s)

          m = Path('Makefile')
          ms = m.read_text()
          if 'PKG_RELEASE:=35' in ms:
              ms = ms.replace('PKG_RELEASE:=35', 'PKG_RELEASE:=36', 1)
              m.write_text(ms)
          elif 'PKG_RELEASE:=36' not in ms:
              raise SystemExit('unexpected LuCI package release')

          checks = Path('tools/check-sources.sh')
          cs = checks.read_text()
          anchor = 'RESCUE_RPC="root/usr/libexec/rpcd/podkop_bot_warpscout_rescue"\n'
          guard = (
              'RUNTIME_RPC="root/usr/libexec/rpcd/podkop_bot"\n'
              'BOT_SRC="root/usr/lib/podkop_bot/podkop_bot"\n'
              'grep -Fq "curl -q -s --noproxy \'*\' --connect-timeout 3 --max-time 8" "$RUNTIME_RPC" || {\n'
              '    echo "Runtime: local Clash API must bypass Bearhole/curlrc" >&2; fail=1\n'
              '}\n'
              'grep -Fq \'Selector|URLTest|Fallback|LoadBalance)\' "$RUNTIME_RPC" || {\n'
              '    echo "Runtime: selector-like Clash group coverage regressed" >&2; fail=1\n'
              '}\n'
              'grep -Fq "curl -q --noproxy \'*\' -s" "$BOT_SRC" || {\n'
              '    echo "Bot: local Clash API must bypass Bearhole/curlrc" >&2; fail=1\n'
              '}\n'
          )
          if 'Runtime: local Clash API must bypass Bearhole/curlrc' not in cs:
              if anchor not in cs:
                  raise SystemExit('check-sources runtime guard anchor missing')
              cs = cs.replace(anchor, guard + anchor, 1)
              checks.write_text(cs)
          PY

          sh -n root/usr/libexec/rpcd/podkop_bot
          sh -n root/usr/lib/podkop_bot/podkop_bot
          sh tools/check-sources.sh
          grep -Fq 'PKG_RELEASE:=36' Makefile

      - name: Commit r36 fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'medvedolog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Makefile root/usr/libexec/rpcd/podkop_bot root/usr/lib/podkop_bot/podkop_bot root/usr/lib/podkop_bot/vendor.sha256 tools/check-sources.sh
          git commit -m '0.19.18-r36: keep Runtime Clash metadata outside Bearhole proxy'
          git push origin HEAD:dev/0.19.18-bearhole-mvp
