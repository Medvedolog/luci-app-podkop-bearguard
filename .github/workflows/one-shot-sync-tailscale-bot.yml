name: one-shot-sync-tailscale-bot
on:
  push:
    branches:
      - dev/0.19.18-tailscale-luci
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-tailscale-luci
      - name: Sync standalone bot
        run: |
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/Medvedolog/podkop_bot/dev/0.19.18-tailscale-preflight/podkop_bot.sh' -o /tmp/podkop_bot
          sh -n /tmp/podkop_bot
          grep -q '_ts_standalone_running()' /tmp/podkop_bot
          grep -q 'ts_add_confirm' /tmp/podkop_bot
          grep -q 'ts_ec_' /tmp/podkop_bot
          install -m 0755 /tmp/podkop_bot root/usr/lib/podkop_bot/podkop_bot
          sha256sum root/usr/lib/podkop_bot/podkop_bot | awk '{print $1 "  podkop_bot"}' > root/usr/lib/podkop_bot/vendor.sha256
          sed -i 's/^PKG_RELEASE:=54$/PKG_RELEASE:=55/' Makefile
          grep -q '^PKG_RELEASE:=55$' Makefile
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-sync-tailscale-bot.yml
          git add Makefile root/usr/lib/podkop_bot/podkop_bot root/usr/lib/podkop_bot/vendor.sha256
          git commit -m '0.19.18-r55: sync Tailscale standalone preflight'
          git push origin HEAD:dev/0.19.18-tailscale-luci
