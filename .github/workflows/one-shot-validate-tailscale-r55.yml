name: one-shot-validate-tailscale-r55
on:
  push:
    branches:
      - dev/0.19.18-tailscale-luci
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-tailscale-luci
      - name: Validate Tailscale slice
        run: |
          sh -n root/usr/libexec/rpcd/podkop_bot_tailscale
          sh -n root/usr/lib/podkop_bot/podkop_bot
          node --check root/www/luci-static/resources/view/podkop-bot/tailscale.js
          python3 -m json.tool root/usr/share/luci/menu.d/luci-app-podkop-bot.json >/dev/null
          python3 -m json.tool root/usr/share/rpcd/acl.d/luci-app-podkop-bot.json >/dev/null
          grep -q '^PKG_RELEASE:=55$' Makefile
          test "$(git hash-object root/usr/lib/podkop_bot/podkop_bot)" = "8695f633d9b6eda9cec17e0062d645209acf9ecb"
      - name: Clean up validator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-validate-tailscale-r55.yml
          git commit -m 'ci: remove one-shot r55 validator'
          git push origin HEAD:dev/0.19.18-tailscale-luci
