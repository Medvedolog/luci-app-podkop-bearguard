name: r44-sync-bot
on:
  push:
    branches: [dev/0.19.18-bearhole-mvp]
    paths:
      - scripts/sync-bot-r44.sh
      - .github/workflows/r44-sync-bot.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-bearhole-mvp
      - name: Sync exact standalone bot into LuCI package
        run: scripts/sync-bot-r44.sh
      - name: Verify and commit r44
        run: |
          sh -n root/usr/lib/podkop_bot/podkop_bot
          test "$(git hash-object root/usr/lib/podkop_bot/podkop_bot)" = "$(git ls-remote https://github.com/Medvedolog/podkop_bot.git refs/heads/dev/0.19.18-poll-warp-rescue >/dev/null 2>&1; git hash-object root/usr/lib/podkop_bot/podkop_bot)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '0.19.18-r44: sync standalone bot and drop r42 hotfix'
          git push origin HEAD:dev/0.19.18-bearhole-mvp
