name: r47 Bearhole lazy UCI init

on:
  push:
    branches: [dev/0.19.18-bearhole-mvp]
    paths: ['.github/workflows/r47_bearhole_uci_lazy_init.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-bearhole-mvp
          fetch-depth: 0
      - name: Patch lazy UCI initialization and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rpc = Path('root/usr/libexec/rpcd/podkop_bot_bearhole')
          s = rpc.read_text()
          anchor = "engine_ready() { [ -z \"$(engine_reason)\" ]; }\n"
          helper = '''engine_ready() { [ -z "$(engine_reason)" ]; }\n\nensure_bearhole_uci() {\n    [ -e /etc/config/podkop_bearhole ] || {\n        mkdir -p /etc/config || return 1\n        : > /etc/config/podkop_bearhole || return 1\n    }\n    uci -q get podkop_bearhole.main >/dev/null 2>&1 || \\\n        uci -q set podkop_bearhole.main=bearhole\n}\n'''
          if 'ensure_bearhole_uci()' not in s:
              if anchor not in s:
                  raise SystemExit('rpc helper anchor not found')
              s = s.replace(anchor, helper, 1)
          s = s.replace('    uci -q set podkop_bearhole.main.enabled=0 >/dev/null 2>&1 || true\n', '    ensure_bearhole_uci >/dev/null 2>&1 || true\n    uci -q set podkop_bearhole.main.enabled=0 >/dev/null 2>&1 || true\n', 1)
          old = '    uci -q get podkop_bearhole.main >/dev/null 2>&1 || uci -q set podkop_bearhole.main=bearhole\n'
          s = s.replace(old, '    ensure_bearhole_uci || { fail_closed uci_init_failed; return; }\n', 1)
          s = s.replace(old, '    ensure_bearhole_uci || return 1\n', 1)
          s = s.replace(old, '    ensure_bearhole_uci || return 1\n', 1)
          rpc.write_text(s)

          ctl = Path('root/usr/lib/podkop_bot/bearhole.sh')
          s = ctl.read_text()
          old = "bh_cfg_get(){ _k=$1; _d=$2; _v=$(uci -q get \"podkop_bearhole.main.$_k\" 2>/dev/null); [ -n \"$_v\" ]&&printf '%s' \"$_v\"||printf '%s' \"$_d\"; }\nbh_cfg_set(){ _k=$1; _v=$2; uci -q get podkop_bearhole.main >/dev/null 2>&1||uci -q set podkop_bearhole.main=bearhole; uci -q set \"podkop_bearhole.main.$_k=$_v\"&&uci -q commit podkop_bearhole; }\n"
          new = "bh_cfg_get(){ _k=$1; _d=$2; _v=$(uci -q get \"podkop_bearhole.main.$_k\" 2>/dev/null); [ -n \"$_v\" ]&&printf '%s' \"$_v\"||printf '%s' \"$_d\"; }\nbh_cfg_ensure(){ [ -e /etc/config/podkop_bearhole ]||{ mkdir -p /etc/config||return 1; : >/etc/config/podkop_bearhole||return 1; }; uci -q get podkop_bearhole.main >/dev/null 2>&1||uci -q set podkop_bearhole.main=bearhole; }\nbh_cfg_set(){ _k=$1; _v=$2; bh_cfg_ensure||return 1; uci -q set \"podkop_bearhole.main.$_k=$_v\"&&uci -q commit podkop_bearhole; }\n"
          if 'bh_cfg_ensure()' not in s:
              if old not in s:
                  raise SystemExit('bearhole cfg anchor not found')
              s = s.replace(old, new, 1)
          ctl.write_text(s)

          check = Path('tools/check-sources.sh')
          s = check.read_text()
          marker = '# Vendored bot is an integrity contract, not merely documentation.\n'
          block = '''# Bearhole owns no packaged UCI file: first mutation must lazily create it.\ngrep -Fq 'ensure_bearhole_uci()' root/usr/libexec/rpcd/podkop_bot_bearhole || { echo "FAIL  Bearhole rpcd lazy UCI init missing"; fail=1; }\ngrep -Fq 'bh_cfg_ensure()' root/usr/lib/podkop_bot/bearhole.sh || { echo "FAIL  Bearhole control lazy UCI init missing"; fail=1; }\n\n'''
          if block not in s:
              if marker not in s:
                  raise SystemExit('check-sources marker not found')
              check.write_text(s.replace(marker, block + marker, 1))
          PY
          sed -i 's/^PKG_RELEASE:=46$/PKG_RELEASE:=47/' Makefile
          sh -n root/usr/libexec/rpcd/podkop_bot_bearhole
          sh -n root/usr/lib/podkop_bot/bearhole.sh
          sh tools/check-sources.sh
          sh tools/check-async-wrappers.sh
          git diff --check
      - name: Commit r47
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile root/usr/libexec/rpcd/podkop_bot_bearhole root/usr/lib/podkop_bot/bearhole.sh tools/check-sources.sh
          git commit -m '0.19.18-r47: lazily initialize Bearhole UCI config'
          git push origin HEAD:dev/0.19.18-bearhole-mvp
