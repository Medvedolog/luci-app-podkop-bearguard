name: r50 revolver and Bearhole UI polish

on:
  push:
    branches: [dev/0.19.18-bearhole-mvp]
    paths: ['.github/workflows/r50_revolver_bearhole_ui.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/0.19.18-bearhole-mvp
          fetch-depth: 0
      - name: Patch r50 UI polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Bearhole resource matrix: hide redundant Releases column and align Checked.
          p=Path('root/www/luci-static/resources/view/podkop-bot/bearhole.js')
          s=p.read_text()
          old="res(_('Архив'),x.github_codeload,'codeload.github.com'),res(_('Релизы'),x.github_assets,_('GitHub release assets')),res('Feeds',x.openwrt_feeds,_('Репозитории OpenWrt'))"
          new="res(_('Архив'),x.github_codeload,'codeload.github.com'),res('Feeds',x.openwrt_feeds,_('Репозитории OpenWrt'))"
          if old not in s: raise SystemExit('mobile Releases anchor not found')
          s=s.replace(old,new,1)
          old="E('td',{'style':'text-align:center;'},[q(x.github_codeload)]),E('td',{'style':'text-align:center;'},[q(x.github_assets)]),E('td',{'style':'text-align:center;'},[q(x.openwrt_feeds)]),E('td',{'style':'white-space:nowrap;'},age(x.checked_at))"
          new="E('td',{'style':'text-align:center;'},[q(x.github_codeload)]),E('td',{'style':'text-align:center;'},[q(x.openwrt_feeds)]),E('td',{'style':'white-space:nowrap;text-align:center;'},age(x.checked_at))"
          if old not in s: raise SystemExit('desktop Releases cell anchor not found')
          s=s.replace(old,new,1)
          old="th(_('Архив'),_('codeload.github.com')),th(_('Релизы'),_('Файлы GitHub Releases и redirect-хосты')),th('Feeds',_('Репозитории OpenWrt')),E('th',{},_('Проверено'))"
          new="th(_('Архив'),_('codeload.github.com')),th('Feeds',_('Репозитории OpenWrt')),th(_('Проверено'),_('Время последней проверки маршрута'))"
          if old not in s: raise SystemExit('desktop Releases header anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("'style':'min-width:760px;'","'style':'min-width:700px;'",1)
          p.write_text(s)

          # Revolver: keep CSS loader phase continuous across 900 ms DOM refreshes,
          # and expose the same backend phases with light revolver-themed copy.
          p=Path('root/www/luci-static/resources/view/podkop-bot/warpscout-rescue.js')
          s=p.read_text()
          old="""function magazineLoader(){
\tvar cells=[];
\tfor(var i=0;i<6;i++)cells.push(E('span',{'class':'pb-mag-load-cell','style':'animation-delay:'+(i*140)+'ms;'},'■'));
\treturn E('span',{'class':'pb-mag-load','title':_('Магазин перезаряжается'),'aria-label':_('Магазин перезаряжается')},[E('span',{'class':'pb-mag-load-cells'},cells),E('span',{'class':'pb-mag-load-text'},_('заряжаю магазин…'))]);
}
"""
          new="""function magazineLoader(reason){
\tvar cells=[],cycle=1250,phase=Date.now()%cycle;
\tfor(var i=0;i<6;i++)cells.push(E('span',{'class':'pb-mag-load-cell','style':'animation-delay:'+(i*140-phase)+'ms;'},'■'));
\tvar labels={manual:_('открываю барабан…'),discovery:_('ищу патроны…'),qualification:_('проверяю капсюли…'),building:_('заряжаю барабан…')};
\tvar text=labels[reason]||_('перезаряжаю…');
\treturn E('span',{'class':'pb-mag-load','title':_('Магазин перезаряжается'),'aria-label':_('Магазин перезаряжается')},[E('span',{'class':'pb-mag-load-cells'},cells),E('span',{'class':'pb-mag-load-text'},text)]);
}
"""
          if old not in s: raise SystemExit('magazineLoader r49 anchor not found')
          s=s.replace(old,new,1)
          old="var phase={manual:_('этап 1/4 · подготовка'),discovery:_('этап 1/4 · поиск WARP-узлов'),qualification:_('этап 2/4 · проверка Telegram API'),building:_('этап 3/4 · сбор магазина')};"
          new="var phase={manual:_('этап 1/4 · открываю барабан · подготовка'),discovery:_('этап 1/4 · ищу патроны · WARP Discovery'),qualification:_('этап 2/4 · проверяю капсюли · Telegram API'),building:_('этап 3/4 · заряжаю барабан · только VALID')};"
          if old not in s: raise SystemExit('reload phase anchor not found')
          s=s.replace(old,new,1)
          old="busyLabel=_('Запуск WARP')+' · '+String(rs.index||0)+' / '+String(rs.total||0)+' · '+_('SOCKS → Telegram getMe');"
          new="busyLabel=_('Взведение и тестовый отстрел')+' · '+String(rs.index||0)+' / '+String(rs.total||0)+' · '+_('SOCKS → Telegram getMe');"
          if old not in s: raise SystemExit('firing label anchor not found')
          s=s.replace(old,new,1)
          old="var position=rs.busy&&rs.state==='reloading'?magazineLoader():E('span',{},String(rs.index||0)+' / '+String(rs.total||0));"
          new="var position=rs.busy&&rs.state==='reloading'?magazineLoader(rs.reason):E('span',{},String(rs.index||0)+' / '+String(rs.total||0));"
          if old not in s: raise SystemExit('position loader anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          mk=Path('Makefile')
          m=mk.read_text()
          if 'PKG_RELEASE:=49' not in m: raise SystemExit('expected r49')
          mk.write_text(m.replace('PKG_RELEASE:=49','PKG_RELEASE:=50',1))
          PY
          sh tools/check-sources.sh
          sh tools/check-async-wrappers.sh
          git diff --check
      - name: Commit r50
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile root/www/luci-static/resources/view/podkop-bot/bearhole.js root/www/luci-static/resources/view/podkop-bot/warpscout-rescue.js
          git commit -m '0.19.18-r50: polish Bearhole matrix and revolver reload UX'
          git push origin HEAD:dev/0.19.18-bearhole-mvp
