name: r50 bot restart alert final sync
on:
  push:
    branches:
      - dev/0.19.18-bearhole-mvp
    paths:
      - .github/workflows/r50_sync_singbox_restart_alert.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-bearhole-mvp
          fetch-depth: 0
      - name: Sync final standalone bot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/Medvedolog/podkop_bot/e53626f24d99e98b491283c0da09d2d94d60f3ac/podkop_bot.sh' -o root/usr/lib/podkop_bot/podkop_bot
          chmod 0755 root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum podkop_bot > vendor.sha256)
          grep -q '^PKG_RELEASE:=50$' Makefile
          sh -n root/usr/lib/podkop_bot/podkop_bot
          sh tools/check-sources.sh
          sh tools/check-bot-transport.sh
          sh tools/check-async-wrappers.sh
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add root/usr/lib/podkop_bot/podkop_bot root/usr/lib/podkop_bot/vendor.sha256
          git commit -m '0.19.18-r50: sync final sing-box restart alert fix'
          git push origin HEAD:dev/0.19.18-bearhole-mvp
