name: r50 bot restart alert sync
on:
  push:
    branches:
      - dev/0.19.18-bearhole-mvp
    paths:
      - .github/workflows/r50_sync_singbox_restart_alert.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-bearhole-mvp
          fetch-depth: 0
      - name: Sync standalone bot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/Medvedolog/podkop_bot/6460f3ce71523cd1681bc61bada859b0c70744e0/podkop_bot.sh' -o root/usr/lib/podkop_bot/podkop_bot
          chmod 0755 root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum podkop_bot > vendor.sha256)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Makefile')
          s=p.read_text()
          if 'PKG_RELEASE:=49' not in s:
              raise SystemExit('expected r49')
          p.write_text(s.replace('PKG_RELEASE:=49','PKG_RELEASE:=50',1))
          PY
          sh -n root/usr/lib/podkop_bot/podkop_bot
          sh tools/check-sources.sh
          sh tools/check-bot-transport.sh
          sh tools/check-async-wrappers.sh
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile root/usr/lib/podkop_bot/podkop_bot root/usr/lib/podkop_bot/vendor.sha256
          git commit -m '0.19.18-r50: sync sing-box restart alert from standalone'
          git push origin HEAD:dev/0.19.18-bearhole-mvp
