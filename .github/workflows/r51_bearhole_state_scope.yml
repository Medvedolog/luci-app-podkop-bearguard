name: r51 Bearhole state and scope UX
on:
  push:
    branches: [dev/0.19.18-bearhole-mvp]
    paths:
      - .github/workflows/r51_bearhole_state_scope.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-bearhole-mvp
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/r51_patch.py
      - name: Validate
        run: |
          sh -n scripts/postinst
          sh -n root/usr/lib/podkop_bot/bearhole.sh
          sh tools/check-sources.sh
          sh tools/check-async-wrappers.sh
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile scripts/postinst root/usr/lib/podkop_bot/bearhole.sh root/www/luci-static/resources/view/podkop-bot/bearhole.js
          git commit -m '0.19.18-r51: reconcile Bearhole state and expose system proxy scope'
          git push origin HEAD:dev/0.19.18-bearhole-mvp
