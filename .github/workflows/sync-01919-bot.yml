name: Sync 0.19.19 bot
on:
  push:
    branches: [dev/0.19.19-tailscale-multiprovider]
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, 'sync standalone bot 0.19.19')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.19-tailscale-multiprovider
      - name: Fetch and validate standalone bot
        run: |
          curl -LfsS https://raw.githubusercontent.com/Medvedolog/podkop_bot/dev/0.19.19-tailscale-multiprovider/podkop_bot.sh -o /tmp/podkop_bot
          test "$(grep '^BOT_VERSION=' /tmp/podkop_bot | cut -d\" -f2)" = "0.19.19"
          sh -n /tmp/podkop_bot
          install -m 0755 /tmp/podkop_bot root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum podkop_bot > vendor.sha256)
          sh -n root/usr/libexec/rpcd/podkop_bot_tailscale
          node --check root/www/luci-static/resources/view/podkop-bot/tailscale.js
      - name: Commit sync and remove helper
        run: |
          rm -f .github/workflows/sync-01919-bot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'luci: sync standalone bot 0.19.19'
          git push
