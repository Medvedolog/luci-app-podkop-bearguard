name: sync-bot-state-nav-fix

on:
  push:
    branches:
      - dev/0.19.18-warpscout-luci
    paths:
      - .github/workflows/sync-bot-state-nav-fix.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LuCI branch
        uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-warpscout-luci
          fetch-depth: 0

      - name: Sync fixed standalone bot
        shell: bash
        run: |
          set -euo pipefail
          dst='root/usr/lib/podkop_bot/podkop_bot'
          curl -fsSL 'https://raw.githubusercontent.com/Medvedolog/podkop_bot/dev/0.19.17-security-hardening/podkop_bot.sh' -o "$dst"
          test "$(git hash-object "$dst")" = 'e2c19245321eb4b0b48ebd6b7c829e26d23b297e'
          grep -A10 'Persistent keyboard navigation must win' "$dst" | grep -q 'cmd_status'
          bash -n "$dst"
          dash -n "$dst"

      - name: Commit vendored bot and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-bot-state-nav-fix.yml
          git add root/usr/lib/podkop_bot/podkop_bot
          git commit -m "fix(bot): sync pending-state Status escape"
          git push origin HEAD:dev/0.19.18-warpscout-luci
