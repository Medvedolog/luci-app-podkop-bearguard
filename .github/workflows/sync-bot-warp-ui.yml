name: Sync WARP-aware bot vendor

on:
  push:
    branches:
      - dev/0.19.18-bearhole-mvp

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-bearhole-mvp
          fetch-depth: 0
      - name: Sync standalone bot and bump package release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Medvedolog/podkop_bot/494315c45b2432f4d759b59502db7e8e0f404bb4/podkop_bot.sh \
            -o root/usr/lib/podkop_bot/podkop_bot
          chmod 0755 root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum podkop_bot > vendor.sha256)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Makefile')
          s=p.read_text()
          old='PKG_RELEASE:=33'
          new='PKG_RELEASE:=34'
          if old not in s:
              raise SystemExit('expected r33 before WARP UI sync')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate vendor
        shell: bash
        run: |
          set -euo pipefail
          sh -n root/usr/lib/podkop_bot/podkop_bot
          grep -Fq "warp_rescue) printf 'WARP Rescue'" root/usr/lib/podkop_bot/podkop_bot
          grep -Fq '<code>warp_rescue</code>' root/usr/lib/podkop_bot/podkop_bot
          grep -Fq '_append_channel "WARP Rescue"' root/usr/lib/podkop_bot/podkop_bot
          grep -Fq 'WARP Rescue (127.0.0.1:' root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum -c vendor.sha256)
          sh tools/check-sources.sh
          git diff --check
      - name: Commit one-shot result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-bot-warp-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '0.19.18-r34: sync WARP Rescue transport UI'
          git push origin HEAD:dev/0.19.18-bearhole-mvp
