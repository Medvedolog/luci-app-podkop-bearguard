name: sync-build-r59
on:
  push:
    branches: [dev/0.19.18-tailscale-multiprovider]
    paths: ['.github/workflows/sync-build-r59.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev/0.19.18-tailscale-multiprovider
      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1
      - name: Sync standalone and bump r59
        run: |
          set -eu
          curl -fsSL 'https://raw.githubusercontent.com/Medvedolog/podkop_bot/dev/0.19.18-tailscale-multiprovider/podkop_bot.sh' -o root/usr/lib/podkop_bot/podkop_bot
          chmod 0755 root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum podkop_bot > vendor.sha256)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Makefile'); s=p.read_text()
          if 'PKG_RELEASE:=58' not in s: raise SystemExit('expected r58')
          p.write_text(s.replace('PKG_RELEASE:=58','PKG_RELEASE:=59',1))
          PY
      - name: Validate sources
        run: |
          set -eu
          sh -n root/usr/lib/podkop_bot/podkop_bot
          grep -Fq 'ts_add|ts_add_confirm|ts_ld_*|ts_ldc_*|ts_e_*|ts_ec_*|ts_x_*|ts_r_*)' root/usr/lib/podkop_bot/podkop_bot
          grep -Fq '➕ Создать новое tsnet' root/usr/lib/podkop_bot/podkop_bot
          ! grep -E '^[[:space:]]*sing-box[[:space:]]+version' root/usr/lib/podkop_bot/podkop_bot root/usr/lib/podkop_bot/tsnet-provider.sh
          grep -q '^PKG_RELEASE:=59$' Makefile
          sh tools/check-sources.sh
      - name: Commit r59 sources
        run: |
          set -eu
          git config user.name medvedolog
          git config user.email tenkayyy8@gmail.com
          git add Makefile root/usr/lib/podkop_bot/podkop_bot root/usr/lib/podkop_bot/vendor.sha256
          git commit -m 'fix: route legacy Tailscale cleanup callbacks'
          git push origin HEAD:dev/0.19.18-tailscale-multiprovider
      - name: Build packages
        run: |
          set -eu
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./tools/stage.sh
          owfeed plan
          owfeed build
          sh tools/check-package.sh
          test -n "$(find dist/all -maxdepth 1 -type f -name 'luci-app-podkop-bot_*.ipk' -print -quit)"
          test -n "$(find dist/noarch -maxdepth 1 -type f -name 'luci-app-podkop-bot-*.apk' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: luci-app-podkop-bot-0.19.18-r59
          path: dist/
          if-no-files-found: error
