name: sync-build-r60
on:
  push:
    branches: [dev/0.19.18-tailscale-multiprovider]
    paths:
      - '.github/workflows/sync-build-r60.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev/0.19.18-tailscale-multiprovider
      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1
      - name: Sync standalone and add backend API v1
        run: |
          set -eu
          curl -fsSL 'https://raw.githubusercontent.com/Medvedolog/podkop_bot/dev/0.19.18-tailscale-multiprovider/podkop_bot.sh' -o root/usr/lib/podkop_bot/podkop_bot
          chmod 0755 root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum podkop_bot > vendor.sha256)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('root/usr/libexec/rpcd/podkop_bot_tailscale')
          s=p.read_text()
          old='''    list) echo '{"status":{},"create":{"control_url":"","auth_key":"","hostname":"","advertise_exit_node":false,"confirm_standalone":false},"set_enabled":{"enabled":false,"confirm_standalone":false},"set_advertise_exit_node":{"enabled":false},"delete":{"purge_state":false,"legacy_native":false}}' ;;'''
          new='''    list) echo '{"api_version":1,"status":{},"create":{"control_url":"","auth_key":"","hostname":"","advertise_exit_node":false,"confirm_standalone":false},"set_enabled":{"enabled":false,"confirm_standalone":false},"set_advertise_exit_node":{"enabled":false},"delete":{"purge_state":false,"legacy_native":false}}' ;;'''
          if old not in s: raise SystemExit('backend list anchor not found')
          p.write_text(s.replace(old,new,1))
          p=Path('Makefile'); s=p.read_text()
          if 'PKG_RELEASE:=59' not in s: raise SystemExit('expected r59')
          p.write_text(s.replace('PKG_RELEASE:=59','PKG_RELEASE:=60',1))
          PY
      - name: Validate sources
        run: |
          set -eu
          sh -n root/usr/lib/podkop_bot/podkop_bot
          sh -n root/usr/libexec/rpcd/podkop_bot_tailscale
          sh -n root/usr/lib/podkop_bot/tsnet-provider.sh
          grep -Fq 'TS_BACKEND_API_REQUIRED=1' root/usr/lib/podkop_bot/podkop_bot
          grep -Fq '"api_version":1' root/usr/libexec/rpcd/podkop_bot_tailscale
          grep -q '^PKG_RELEASE:=60$' Makefile
          sh tools/check-sources.sh
      - name: Commit r60 sources
        run: |
          set -eu
          git config user.name medvedolog
          git config user.email tenkayyy8@gmail.com
          git add Makefile root/usr/lib/podkop_bot/podkop_bot root/usr/lib/podkop_bot/vendor.sha256 root/usr/libexec/rpcd/podkop_bot_tailscale
          git commit -m 'fix: expose tsnet controller API capability'
          git push origin HEAD:dev/0.19.18-tailscale-multiprovider
      - name: Build packages
        run: |
          set -eu
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./tools/stage.sh
          owfeed plan
          owfeed build
          sh tools/check-package.sh
          test -n "$(find dist/all -maxdepth 1 -type f -name 'luci-app-podkop-bot_*.ipk' -print -quit)"
          test -n "$(find dist/noarch -maxdepth 1 -type f -name 'luci-app-podkop-bot-*.apk' -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: luci-app-podkop-bot-0.19.18-r60
          path: dist/
          if-no-files-found: error
