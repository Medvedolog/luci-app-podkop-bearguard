name: Sync Forkop 2 bot verified hotfix into BearGuard test branch
on:
  push:
    branches: [main]
    paths: [.github/workflows/sync-forkop2-test-bot.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-pascal-1kzrka
          persist-credentials: true
      - name: Sync pinned, reviewed test bot and vendor checksum
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 10 --max-time 90 \
            https://raw.githubusercontent.com/Medvedolog/podkop_bot/7f1e343f2d1ab06c14de524a6f7e297041f44f57/podkop_bot.sh \
            -o root/usr/lib/podkop_bot/podkop_bot
          (cd root/usr/lib/podkop_bot && sha256sum podkop_bot > vendor.sha256)
          sh -n root/usr/lib/podkop_bot/podkop_bot
          grep -Fq 'only exact, verified Selector/Fallback membership' root/usr/lib/podkop_bot/podkop_bot
          grep -Fq '_handle_forkop_ext "fk_ut_menu"' root/usr/lib/podkop_bot/podkop_bot
          grep -Fq 'urltest_settings|urltest_filters_menu)' root/usr/lib/podkop_bot/podkop_bot
          grep -Fq 'Do NOT activate a latent, unused include_outbounds list' root/usr/lib/podkop_bot/podkop_bot
          grep -Fq 'ts_cap_info' root/usr/lib/podkop_bot/podkop_bot
      - name: Check package integration and compatibility
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y jq
          sh tools/check-provider-compat.sh
          sh tools/check-bot-transport.sh
          sh tools/check-tailscale-rpc-acl.sh
      - name: Commit verified vendored bot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add root/usr/lib/podkop_bot/podkop_bot root/usr/lib/podkop_bot/vendor.sha256
          git diff --cached --quiet && { echo "Nothing to sync"; exit 0; }
          git commit -m "fix: sync verified Forkop 2 URLTest filter regression fixes from podkop_bot"
          git push origin HEAD:claude/funny-pascal-1kzrka
