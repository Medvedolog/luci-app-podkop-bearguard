name: tsnet-bot-patch
on:
  push:
    branches:
      - dev/0.19.18-tailscale-multiprovider
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', '[tsnet-bot-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/0.19.18-tailscale-multiprovider
          fetch-depth: 0
      - run: python3 .github/patch_tsnet_bot.py
      - name: Validate
        run: |
          sh -n root/usr/lib/podkop_bot/podkop_bot
          sh -n root/usr/lib/podkop_bot/tsnet-provider.sh
          sh -n root/usr/lib/podkop_bot/tsnet-overlay-watch.sh
          sh -n root/usr/libexec/rpcd/podkop_bot_tailscale
          sh -n root/etc/init.d/podkop-tsnet-overlay
          node --check root/www/luci-static/resources/view/podkop-bot/tailscale.js
          python3 -m json.tool root/usr/share/luci/menu.d/luci-app-podkop-bot.json >/dev/null
          python3 -m json.tool root/usr/share/rpcd/acl.d/luci-app-podkop-bot.json >/dev/null
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add root/usr/lib/podkop_bot/podkop_bot
          git commit -m 'bot: use multiprovider tsnet backend [tsnet-bot-patched]'
          git push origin HEAD:dev/0.19.18-tailscale-multiprovider
