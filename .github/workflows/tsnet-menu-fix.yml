name: tsnet-menu-fix
on:
  push:
    branches: [dev/0.19.18-tailscale-multiprovider]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', '[tsnet-menu-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev/0.19.18-tailscale-multiprovider, fetch-depth: 0}
      - name: Patch menu gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('root/usr/lib/podkop_bot/podkop_bot')
          s=p.read_text(); old=s
          s,n1=re.subn(r'(case "\$PODKOP_VARIANT" in\s*\n\s*)plus\|forkop\)(\s*\n\s*kb=.*?cmd_server_instances)',r'\1original|plus|forkop)\2',s,count=1)
          s,n2=re.subn(r'("cmd_server_instances"\)\s*\n(?:.*\n){0,5}?\s*case "\$PODKOP_VARIANT" in\s*\n\s*)plus\|forkop\) : ;;',r'\1original|plus|forkop) : ;;',s,count=1)
          if n1 != 1 or n2 != 1: raise SystemExit(f'menu patch counts: {n1},{n2}')
          p.write_text(s)
          PY
          sh -n root/usr/lib/podkop_bot/podkop_bot
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add root/usr/lib/podkop_bot/podkop_bot
          git commit -m 'bot: expose tsnet service on classic Podkop [tsnet-menu-fixed]'
          git push origin HEAD:dev/0.19.18-tailscale-multiprovider
