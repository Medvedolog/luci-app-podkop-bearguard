name: WARPSCOUT MIPSLE via owfeed

on:
  push:
    branches:
      - dev/0.19.19-warpscout-mipsle
  workflow_dispatch:
    inputs:
      warpscout_ref:
        description: "Upstream WARPSCOUT tag/commit"
        required: false
        default: "v0.16.0"
      warpscout_version:
        description: "OpenWrt package version"
        required: false
        default: "0.16.0-r1"

permissions:
  contents: read

jobs:
  build:
    name: owfeed package for mipsel_24kc
    runs-on: ubuntu-latest
    env:
      DEFAULT_WARPSCOUT_REF: v0.16.0
      DEFAULT_WARPSCOUT_VERSION: 0.16.0-r1
    steps:
      - name: Checkout BearGuard
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve WARPSCOUT version
        id: ws
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.warpscout_ref }}"
          VERSION="${{ github.event.inputs.warpscout_version }}"
          [ -n "$REF" ] || REF="$DEFAULT_WARPSCOUT_REF"
          [ -n "$VERSION" ] || VERSION="$DEFAULT_WARPSCOUT_VERSION"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream WARPSCOUT
        uses: actions/checkout@v7
        with:
          repository: vernette/warpscout
          ref: ${{ steps.ws.outputs.ref }}
          path: upstream/warpscout
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/warpscout/go.mod
          cache-dependency-path: upstream/warpscout/go.sum

      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1

      - name: Reproducible package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build upstream WARPSCOUT for mipsle
        working-directory: upstream/warpscout
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
        run: |
          set -euo pipefail
          PKG_VERSION="${{ steps.ws.outputs.version }}"
          BIN_VERSION="${PKG_VERSION%-r*}"
          go build -trimpath -ldflags="-s -w -X main.version=$BIN_VERSION" -o warpscout .
          file warpscout
          readelf -h warpscout
          file warpscout | grep -qi 'MIPS'
          COMMIT="$(git rev-parse HEAD)"
          echo "WARPSCOUT_COMMIT=$COMMIT" >> "$GITHUB_ENV"

      - name: Stage LuCI and WARPSCOUT payloads
        shell: bash
        run: |
          set -euo pipefail
          sh tools/stage.sh
          sh tools/stage-warpscout.sh             upstream/warpscout/warpscout             upstream/warpscout             "${{ steps.ws.outputs.version }}"

      - name: Build packages with owfeed
        shell: bash
        run: |
          set -euo pipefail
          owfeed plan
          owfeed check
          owfeed build
          echo "=== WARPSCOUT packages ==="
          find dist -type f \( -name 'warpscout_*.ipk' -o -name 'warpscout-*.apk' \) -print -exec ls -lh {} \;
          test -n "$(find dist -type f -name 'warpscout_*_mipsel_24kc.ipk' -print -quit)"

      - name: Upload owfeed output
        uses: actions/upload-artifact@v7
        with:
          name: warpscout-owfeed-mipsel_24kc
          path: dist/
          if-no-files-found: error
